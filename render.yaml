services:
  - type: web
    name: kaili-travel
    runtime: static
    buildCommand: echo "静态站点，无需构建"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # 注意：Render 的 header 写法是扁平的 path / name / value。
    # 不要用 Cloudflare/Netlify 那种 pattern + headers[{key,value}] 的嵌套写法，Render 会静默忽略整段配置。
    headers:
      # SW 脚本本身必须每次协商，否则更新不生效
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # 图片/字体/图标内容不变，长缓存
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # CSS/JS：短期强缓存 + 过期后后台异步更新；SW 已负责即时生效，这里让浏览器 HTTP 缓存也能直接命中
      - path: /css/*
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=604800
      - path: /js/*
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=604800
      # HTML 保持协商，保证部署后立刻拿到新版本
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /
        destination: /index.html
