services:
  - type: web
    # 必须与 Render 上实际的服务名一致（线上地址是 kaili.onrender.com，服务名就是 kaili）。
    # 早先这里写的是 kaili-travel，与线上对不上，导致下方 headers 整段被忽略：
    # 线上所有资源一直返回 Render 默认的 `public, max-age=0, s-maxage=300`。
    # 注意：改这里只在 Blueprint 已被 Render 关联时才会生效；若服务当初是手动创建的，
    # 需要在 Render 控制台的 Blueprint 页面手动 Sync 一次。
    name: kaili
    runtime: static
    buildCommand: echo "静态站点，无需构建"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # 注意：Render 的 header 写法是扁平的 path / name / value。
    # 不要用 Cloudflare/Netlify 那种 pattern + headers[{key,value}] 的嵌套写法，Render 会静默忽略整段配置。
    headers:
      # SW 脚本本身必须每次协商，否则更新不生效
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # 资源（图片/字体/图标）：不用 immutable。
      # 文件名没有内容哈希，原地替换同名文件时 immutable 会让浏览器与边缘缓存最长一年
      # 返回旧字节；而且 SW 安装时的 cache.add() 也会命中这份旧字节、把旧文件写进新缓存，
      # 所以升 SW 版本号救不回来。最容易踩的是 fonts：tools/subset-font.py 就是原地覆盖
      # noto-serif-sc-subset.woff2，改标题文案重跑后老访客会一直拿旧子集、新字掉到系统宋体。
      # 改为与 CSS/JS 同级：5 分钟后过期、后台异步更新，最迟约 5 分钟自动换新。
      # 若以后给文件名加上内容哈希，再换回 max-age=31536000, immutable。
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=604800
      # CSS/JS：短期强缓存 + 过期后后台异步更新；SW 已负责即时生效，这里让浏览器 HTTP 缓存也能直接命中
      - path: /css/*
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=604800
      - path: /js/*
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=604800
      # HTML 保持协商，保证部署后立刻拿到新版本
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /
        destination: /index.html
